project:
  channel_name: "Your Channel Name"
  output_dir: "output"
  language: "hi"          # hi = Hindi/Hinglish content
  timezone: "Asia/Kolkata"
  # Posting cadence for the 24x7 cloud scheduler (see .github/workflows/publish.yml): 3 videos/day
  # at researched peak windows for Hindi spiritual/meditation Shorts in India — morning commute,
  # lunch-break scroll, and evening wind-down (strongest window). Keep this in sync with the cron
  # entries in the workflow (which are in UTC = IST - 5:30) if you change it.
  post_times_ist:
    - "07:15"
    - "12:45"
    - "20:15"

format:
  mode: "short"            # short or long
  width: 1080
  height: 1920
  fps: 30
  target_duration_seconds: 32
  clip_seconds: 5

style:
  # Top location/pin label. IMPORTANT: only use a specific place if the footage really is that place.
  location_label: "RISHIKESH | UTTARAKHAND"
  caption_font: "Noto Sans Devanagari"
  location_font: "Noto Sans Devanagari"
  caption_font_size: 76
  location_font_size: 54
  caption_margin_bottom: 240
  location_margin_top: 95
  use_location_pin: true

content:
  ideas_csv: "data/ideas.csv"
  locations_csv: "data/locations.csv"
  topic_index: 0
  # If true and Ollama is running, generate a fresh script from the selected idea.
  # If false, uses the built-in original script lines in data/ideas.csv.
  use_ollama: false
  lines_per_short: 5
  forbidden_claims:
    - "cure disease"
    - "guaranteed miracle"
    - "open third eye in 5 minutes"

visuals:
  source: "auto"   # auto (Pixabay + Pexels), pexels_or_local, pixabay_or_local, local_only
  # Pixabay has noticeably more India-specific footage than Pexels; used first when both keys are set.
  pixabay_queries:
    - "Rishikesh Ganga India"
    - "Varanasi ghat India"
    - "Himalaya India mountains"
    - "India temple travel"
  pexels_queries:
    - "Rishikesh Ganga river India vertical"
    - "Ganges river India temple vertical"
    - "Himalaya river meditation India vertical"
  # Left blank on purpose: assets/videos only has generic ocean/waterfall stock (not India
  # footage), which would look wrong/mislabeled under a Rishikesh/Kashi/Himalaya pin. Every
  # topic now pulls matching India footage from Pixabay/Pexels via content.py's topic->place map.
  local_video_dir: ""
  downloads_dir: "assets/videos/pexels"
  pixabay_downloads_dir: "assets/videos/pixabay"
  max_downloads: 12
  orientation: "portrait"

music:
  # Put a legitimate free track from Pixabay/Mixkit/YouTube Audio Library here.
  # Leave blank for voice-only.
  path: "assets/music/background.mp3"
  volume: 0.11

voice:
  engine: "kokoro"
  lang_code: "h"          # Kokoro: h=Hindi, a=US English, b=British English
  voice_id: "hm_psi"      # Hindi: hf_alpha/hf_beta (female), hm_omega/hm_psi (male); hm_psi = deeper
  # Reverted 2026-08-08: 0.78 speed + 0.55s pauses were confirmed by real listening feedback to
  # sound worse/more unrealistic, not more human — the theory (less robotic uniformity) didn't
  # hold up in practice. Back to the pace that was confirmed good before that change.
  speed: 0.85
  pause_seconds: 0.15     # small gap only, mostly relying on Kokoro's own natural per-line gap

metadata:
  hashtags:
    - "#meditation"
    - "#innerpeace"
    - "#rishikesh"
    - "#ganga"
    - "#shorts"
  category_id: "22"       # People & Blogs; consider 27 Education for educational guides.
  made_for_kids: false
  contains_synthetic_media: false # Set true if you use realistic AI-generated visuals/altered real scenes/voice imitation.

upload:
  enabled: true
  privacy_status: "public"    # private/unlisted/public.
  publish_at: ""              # ISO time, e.g. 2026-08-01T18:30:00+05:30; requires privacy_status=private
  upload_thumbnail: true
  upload_captions: true

instagram:
  # Official Meta Graph API (Instagram content publishing) — no browser bots, no scraping.
  # Requires: a Facebook Page -> linked Instagram Professional (Business/Creator) account ->
  # a Meta developer app with instagram_content_publish permission -> a long-lived access token.
  # See README section "Instagram automation" for the setup steps. Turned on/off via the
  # INSTAGRAM_ENABLED repo *variable* in GitHub Actions (Settings -> Secrets and variables ->
  # Actions -> Variables), not this file, since the workflow needs to know before it even runs.
  # The Graph API can only fetch video from a public HTTPS URL, not a direct file upload — the
  # workflow publishes each video as a GitHub Release asset and passes that URL in directly.
  # public_repo_raw_base below is only used as a fallback if you run instagram_uploader.py
  # by hand without --video-url.
  public_repo_raw_base: ""   # e.g. "https://raw.githubusercontent.com/<user>/<repo>/main"
