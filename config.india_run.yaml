project:
  channel_name: "Your Channel Name"
  output_dir: "output"
  language: "hi"          # hi = Hindi/Hinglish content
  timezone: "Asia/Kolkata"

format:
  mode: "short"            # short or long
  width: 1080
  height: 1920
  fps: 30
  target_duration_seconds: 32
  clip_seconds: 5

style:
  # Footage is pulled from mixed India queries (Rishikesh/Varanasi/Himalaya/temple), so use a
  # generic honest label instead of claiming one unverified specific place.
  location_label: "INDIA | SACRED PLACES"
  caption_font: "Noto Sans Devanagari"
  location_font: "Noto Sans Devanagari"
  caption_font_size: 76
  location_font_size: 54
  caption_margin_bottom: 240
  location_margin_top: 95
  use_location_pin: true

content:
  ideas_csv: "data/ideas.csv"
  locations_csv: "data/locations.csv"
  topic_index: 0
  use_ollama: false
  lines_per_short: 5
  forbidden_claims:
    - "cure disease"
    - "guaranteed miracle"
    - "open third eye in 5 minutes"

visuals:
  source: "auto"   # auto (Pixabay + Pexels), pexels_or_local, pixabay_or_local, local_only
  pixabay_queries:
    - "Rishikesh Ganga India"
    - "Varanasi ghat India"
    - "Himalaya India mountains"
    - "India temple travel"
  pexels_queries:
    - "Rishikesh Ganga river India vertical"
    - "Ganges river India temple vertical"
    - "Himalaya river meditation India vertical"
  local_video_dir: ""   # excluded for this batch: existing local clips are generic ocean waves, not India
  downloads_dir: "assets/videos/pexels"
  pixabay_downloads_dir: "assets/videos/pixabay"
  max_downloads: 8
  orientation: "portrait"

music:
  path: "assets/music/background.mp3"
  volume: 0.11

voice:
  engine: "kokoro"
  lang_code: "h"
  voice_id: "hm_psi"   # deeper male Hindi voice; try hm_omega as the alternative
  speed: 0.85           # slower, more deliberate pace for an elder/gravitas feel

metadata:
  hashtags:
    - "#meditation"
    - "#innerpeace"
    - "#india"
    - "#ganga"
    - "#shorts"
  category_id: "22"
  made_for_kids: false
  contains_synthetic_media: false

upload:
  enabled: false
  privacy_status: "private"
  publish_at: ""
  upload_thumbnail: true
  upload_captions: true
